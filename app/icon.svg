<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="Tagloom" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Tagloom</title>

  <!-- Warp threads: their lengths trace the silhouette of a tag -->
  <g stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M16 22 V54" stroke="#2B2A8F"/>
    <path d="M24 16 V54" stroke="#5B4DE0"/>
    <path d="M32 24 V54" stroke="#2B2A8F"/>
    <path d="M40 16 V54" stroke="#5B4DE0"/>
    <path d="M48 22 V54" stroke="#2B2A8F"/>
  </g>

  <!-- Hanging loop -->
  <circle cx="32" cy="12.5" r="3.6" fill="none" stroke="#F5B83D" stroke-width="2.6"/>

  <!-- Weft threads -->
  <g stroke="#F5B83D" stroke-width="3.4" stroke-linecap="round" fill="none">
    <path d="M12 34 H52"/>
    <path d="M12 42 H52"/>
    <path d="M12 50 H52"/>
  </g>

  <!-- Warp passes over weft (alternating, so the threads weave) -->
  <g stroke-width="5" stroke-linecap="butt" fill="none">
    <g stroke="#2B2A8F">
      <path d="M16 31 V37"/><path d="M32 31 V37"/><path d="M48 31 V37"/>
      <path d="M16 47 V53"/><path d="M32 47 V53"/><path d="M48 47 V53"/>
    </g>
    <g stroke="#5B4DE0">
      <path d="M24 39 V45"/><path d="M40 39 V45"/>
    </g>
  </g>
</svg>
